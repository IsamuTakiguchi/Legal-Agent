# TKC ローライブラリー / LEGAL LIBRARY のブラウザ操作設定。
#
# login: 節は公開のログインページから確認した実際のセレクタ（自動ログインに使う）。
# search: / detail: 節はログイン後の画面が開発環境から見えないため推定値。
# 実行時にうまく動かない場合は Claude が画面を解析してセレクタを自動発見し、
# data/selectors.override.yaml に保存する（この設定より優先される）。
# 手で直したい場合も data/selectors.override.yaml に同じ構造で書けばよい。
#
# キーの意味:
#   login_url / check_url : ログイン画面 / ログイン状態確認用に開く URL
#   login_url_pattern     : 現在 URL がこれに一致すれば「未ログイン」
#   login_form_selector   : これが存在すれば「未ログイン」
#   logged_in_selector    : これが存在すれば「ログイン済み」
#   login.user/password/remember/submit : 自動ログイン用フォーム要素
#   search.url            : 検索画面 URL。{query} を含めれば URL 直接指定で検索
#   search.input/submit   : 検索語入力欄と検索ボタン
#   search.results_wait   : 結果が描画されたと見なす要素
#   search.row            : 結果 1 件の要素。row_title/row_link/row_meta はその内側
#   detail.content        : 本文を innerText で取得する要素

tkc:
  label: "TKCローライブラリー（LEX/DB）"
  home_url: "https://www.lawlibrary.jp/"
  login_url: "https://www.lawlibrary.jp/Law/LoginForm.aspx"
  check_url: "https://www.lawlibrary.jp/Law/Searcher.aspx"
  login_url_pattern: "LoginForm\\.aspx"
  login_form_selector: "#LoginForm input#Password"
  logged_in_selector: "a[href*='ogout'], a[href*='Logout'], input[value*='ログアウト'], a:has-text('ログアウト')"
  login:
    user: "#LoginAccount"
    password: "#Password"
    remember: "#SaveIDCheckBox"
    submit: "#ImageButton1"
  search:
    url: "https://www.lawlibrary.jp/Law/Searcher.aspx"
    input: "input[type='text']:visible"
    submit: "input[type='submit']:visible, input[type='image']:visible, button[type='submit']:visible"
    results_wait: "table, .result, .list"
    row: "table tr:has(a[href*='.aspx'])"
    row_title: "a"
    row_link: "a"
    row_meta: "td"
    max_rows: 20
  detail:
    wait: "body"
    content: "#main, #content, .content, body"

legal_library:
  label: "LEGAL LIBRARY"
  home_url: "https://legal-library.jp/"
  login_url: "https://legal-library.jp/login"
  check_url: "https://legal-library.jp/search"
  login_url_pattern: "/login"
  login_form_selector: "input#password"
  logged_in_selector: "a[href*='logout'], a[href*='mypage'], button:has-text('ログアウト'), a:has-text('ログアウト')"
  login:
    user: "#email"
    password: "#password"
    remember: "#keep"
    submit: "#login-btn"
  search:
    url: "https://legal-library.jp/search?keyword={query}"
    input: "input[type='search'], input[name='keyword'], input[name='q'], input[type='text']:visible"
    submit: "button[type='submit']:visible, .Btn:has-text('検索')"
    results_wait: "main, .search-result, .results, .SearchResult"
    row: "main a[href*='/book'], .search-result a, .results a, .SearchResult a, article"
    row_title: ""
    row_link: ""
    row_meta: ""
    max_rows: 20
  detail:
    wait: "main, body"
    content: ".page-text, .text-layer, .viewer-text, .Viewer, main, body"
