[project]
name = "legal-agent"
version = "0.1.0"
description = "判例・文献を横断検索し、出典付きで回答するローカル実行のリーガルリサーチAIエージェント"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pymupdf>=1.24",
    "playwright>=1.47",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio>=4.0"]

[project.scripts]
legal-agent = "legal_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["legal_agent*"]

[tool.setuptools.package-data]
legal_agent = ["static/*", "sources/*.yaml", "browser/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
